# Genera los datos del módulo del tiempo y publica la web en Cloudflare.
#
# Dos veces al día, cuando ECMWF ya ha publicado cada pasada (la de las 00 UTC
# por la mañana y la de las 12 UTC por la noche). También se puede lanzar a
# mano desde la pestaña Actions de GitHub («Run workflow»).
#
# Necesita un secreto del repositorio, CLOUDFLARE_API_TOKEN: un token de
# Cloudflare con la plantilla «Edit Cloudflare Workers» (ver README.md).

name: Generar el tiempo

on:
  schedule:
    - cron: "20 9 * * *"     # 10:20 en invierno, 11:20 en verano (hora peninsular)
    - cron: "20 21 * * *"    # 22:20 en invierno, 23:20 en verano
  workflow_dispatch:
    inputs:
      solo_publicar:
        description: "Solo publicar la web (sin generar datos nuevos)"
        type: boolean
        default: false

permissions:
  contents: write            # para guardar en el repositorio los datos de cada día

concurrency:
  group: generar
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # seis días: ~1,4 GB de ECMWF por ejecución
    steps:
      # Antes que nada (tarda segundos): que el secreto sea un token de Cloudflare
      # válido. Dice qué parece sin enseñarlo y quita espacios o saltos de línea
      # que se cuelen al pegarlo.
      - name: Comprobar el token de Cloudflare
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          LIMPIO=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "::add-mask::$LIMPIO"
          N=${#LIMPIO}
          if [ "$N" -eq 0 ]; then
            echo "::error::El secreto CLOUDFLARE_API_TOKEN está vacío o no existe."; exit 1
          elif printf '%s' "$T" | grep -qiE 'curl|bearer|authorization'; then
            echo "::error::El secreto lleva el comando de prueba (curl/Bearer), no solo el token."; exit 1
          elif [[ "$LIMPIO" =~ ^[0-9a-f]{37}$ ]]; then
            echo "::error::El secreto parece la Global API Key (37 caracteres), no un token de API."; exit 1
          elif [[ ! "$LIMPIO" =~ ^[A-Za-z0-9_-]{30,80}$ ]]; then
            echo "::error::El secreto no tiene forma de token ($N caracteres, con símbolos raros)."; exit 1
          fi
          # Hay dos clases de token: personales (My Profile → API Tokens) y de
          # cuenta (Manage Account → Account API Tokens). Cada uno se verifica
          # en su sitio; cualquiera de los dos vale para publicar.
          CUENTA=$(grep -oE '"account_id": *"[0-9a-f]+"' wrangler.jsonc 2>/dev/null | grep -oE '[0-9a-f]{32}' || true)
          CUENTA=${CUENTA:-1b5310d13cf8bfb869f26cfee252ca16}
          RU=$(curl -s -H "Authorization: Bearer $LIMPIO" https://api.cloudflare.com/client/v4/user/tokens/verify)
          RC=$(curl -s -H "Authorization: Bearer $LIMPIO" "https://api.cloudflare.com/client/v4/accounts/$CUENTA/tokens/verify")
          if printf '%s' "$RU" | grep -q '"status":"active"'; then
            echo "Token personal de Cloudflare válido y activo ($N caracteres)."
          elif printf '%s' "$RC" | grep -q '"status":"active"'; then
            echo "Token de cuenta de Cloudflare válido y activo ($N caracteres)."
          else
            msg() { printf '%s' "$1" | grep -oE '"message":"[^"]*"' | head -2 | tr '\n' ' '; }
            echo "::error::Cloudflare no da el token por bueno ($N caracteres). Como personal: $(msg "$RU") Como de cuenta: $(msg "$RC")"; exit 1
          fi
          echo "CLOUDFLARE_LIMPIO=$LIMPIO" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ !inputs.solo_publicar }}
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        if: ${{ !inputs.solo_publicar }}
        run: pip install -r requirements.txt

      - name: Generar la previsión de seis días
        if: ${{ !inputs.solo_publicar }}
        run: python -m generador

      - name: Guardar los datos en el repositorio
        if: ${{ !inputs.solo_publicar }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitio/datos
          if ! git diff --cached --quiet; then
            git commit -m "Datos del tiempo $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      # Con reintentos: la primera vez, Cloudflare tarda unos segundos en dar
      # por creado el Worker y el paso que activa workers.dev puede fallar.
      - name: Publicar en Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_LIMPIO }}
        run: |
          for intento in 1 2 3; do
            if npx --yes wrangler@4 deploy; then exit 0; fi
            echo "Falló el intento $intento; se reintenta en 20 s…"
            sleep 20
          done
          exit 1
